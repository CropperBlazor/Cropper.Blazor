name: Build, run tests, code linting

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches-ignore:
    - master

jobs:
  code-quality-check:
    name: Check code quality
    uses: CropperBlazor/Cropper.Blazor/.github/workflows/build-test-template.yml@dev
    secrets: inherit

  code-linting:
    name: Code linting
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # needs: code-quality-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          
      - name: Super-Linter
        uses: super-linter/super-linter@v8.2.1
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

           OUTPUT_FOLDER: Reports
           OUTPUT_DETAILS: detailed
           LOG_LEVEL: WARN

           VALIDATE_ALL_CODEBASE: true
           VALIDATE_MARKDOWN: false
           VALIDATE_JAVASCRIPT_PRETTIER: false

           # Exclusions
           FILTER_REGEX_EXCLUDE: '(\W|^)(obj/|bin/)|(\W|^)(.*([.]min[.]css))($)|(\W|^)(.*([.]min[.]js))($)'

           # Include only these folders
           FILTER_REGEX_INCLUDE: (^|/)(src/Cropper\.Blazor/Cropper\.Blazor/|src/Cropper\.Blazor/Cropper\.Blazor\.UnitTests/|src/Cropper\.Blazor/Cropper\.Blazor\.Testing/)

           JSCPD_CONFIG_FILE: '.jscpd.json'
           HTML_FILE_NAME: '.htmlhintrc'
           CSS_FILE_NAME: '.stylelintrc.json'
