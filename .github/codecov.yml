---
comment:
  require_changes: false   # always update PR comment
  behavior: "new"          # create new comment for PR (or update if same PR

coverage:
  precision: 2
  status:
    project:
      default:
        target: 100%       # required coverage value
        threshold: 0.1%    # leniency
    patch:
      default:
        target: 100%
        threshold: 10%

# Flag mapping based on file paths
flags:
  net6:
    paths:
      - "Cropper.Blazor.UnitTests/coverage.net6.0.cobertura.xml"
  net7:
    paths:
      - "Cropper.Blazor.UnitTests/coverage.net7.0.cobertura.xml"
  net8:
    paths:
      - "Cropper.Blazor.UnitTests/coverage.net8.0.cobertura.xml"
  net9:
    paths:
      - "Cropper.Blazor.UnitTests/coverage.net9.0.cobertura.xml"
  net10:
    paths:
      - "Cropper.Blazor.UnitTests/coverage.net10.0.cobertura.xml"
  js:
    paths:
      - "Cropper.Blazor/coverage/cobertura-coverage.xml"
